#!/usr/sbin/nft -f
# hs-sim campus-fw (CT 803): NAT for lab room B (eth1, 10.20.0.0/24) out to the LAN (eth0).
# The active policy for traffic leaving room B lives in /etc/nftables.d/mode.nft (see fw-mode.sh).
flush ruleset
table inet hs_sim_fw {
  chain mode {
  }
  chain forward {
    type filter hook forward priority 0; policy accept;
    ct state established,related accept
    iifname "eth1" jump mode
  }
}
include "/etc/nftables.d/mode.nft"
table ip hs_sim_nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    oifname "eth0" ip saddr 10.20.0.0/24 masquerade
  }
}
