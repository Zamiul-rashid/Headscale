# Tests and an image build on every push and pull request. Nothing is published here; see release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labslots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: labslots
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
